server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the "backend" service name on the docker-compose network — matches
    # VITE_API_BASE_URL=/api/v1 baked into the build and the NestJS app.setGlobalPrefix("api/v1").
    location /api/ {
        proxy_pass http://backend:3003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (react-router) survive a hard refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
