        - name: period
          in: query
          required: false
          description: "Loại kỳ để gộp số liệu — mặc định 'month' nếu không truyền"
          schema: { type: string, enum: [day, week, month], default: month }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/DashboardOverview" } } }

components:
  schemas:
    # ============================================================
    # Phase 1 — ĐÃ BUILD/TEST/SHIP THẬT, giữ nguyên không đổi.
    # ============================================================
    HealthCheckResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
    Lead:
      type: object
      required: [id, name, phone, source, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          nullable: true
          description: >
            Mới (Phase 3) — Mã Lead 4 ký tự [A-Z0-9], server-generated lúc tạo (client không truyền
            được qua CreateLeadInput). Nullable vì Lead tạo trước Phase 3 chưa có, cần backfill.
        name:
          type: string
          description: Tên khách hàng tiềm năng
        phone:
          type: string
          description: Số điện thoại liên hệ
        source:
          type: string
          description: Nguồn lead (ví dụ Pancake, Facebook Ads, giới thiệu...)
        productInterest:
          type: string
          nullable: true
          description: "Mới (Phase 3) — Sản phẩm khách hàng quan tâm"
        threadId:
          type: string
          nullable: true
          description: "Mới (Phase 3) — Mã hội thoại Pancake/Zalo/Messenger (Thread ID)"
        status:
          type: string
          description: Trạng thái xử lý lead trong phễu CRM
          enum: [new, contacted, qualified, converted, lost]
        assignedTo:
          type: string
          format: uuid
          nullable: true
          description: >
            Sale phụ trách lead này, tham chiếu Employee. Mới (Phase 3): tự động gán round-robin
            theo Employee(role=Sale, status=active) lúc POST /leads nếu không truyền.
        sourcedBy:
          type: string
          format: uuid
          nullable: true
          description: >
            Mới — Nhân viên Marketing tạo/nguồn lead này, tham chiếu Employee(role=MKT). Tự động
            gán round-robin theo Employee(role=MKT, status=active) lúc POST /leads, dùng để tính
            Dashboard doanh thu Marketing gắn với Lead.
        score:
          type: number
          nullable: true
          description: "Mới (Phase 2) — điểm đánh giá lead"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLeadInput:
      type: object
      required: [name, phone, source]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        productInterest:
          type: string
          description: "Mới (Phase 3) — Sản phẩm khách hàng quan tâm"
        threadId:
          type: string
          description: "Mới (Phase 3) — Mã hội thoại Pancake/Zalo/Messenger (Thread ID)"
        sourcedBy:
          type: string
          format: uuid
          description: "Mới — chọn tay nhân viên Marketing (Employee role=MKT), bỏ trống thì tự động round-robin"
    UpdateLeadInput:
      type: object
      description: Mới (Phase 2)
      properties:
        status: { type: string, enum: [new, contacted, qualified, converted, lost] }
        assignedTo: { type: string, format: uuid, nullable: true }
        note: { type: string, description: "Ghi vào LeadLog cùng lần đổi trạng thái/assignedTo này" }
    LeadLog:
      type: object
      description: >
        Mới (Phase 2), mở rộng (Phase 3) — append-only, tự sinh khi PATCH /leads/{id} đổi status
        VÀ/HOẶC đổi assignedTo (trước Phase 3 chỉ ghi khi đổi status).
      required: [id, leadId, createdAt]
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string, nullable: true, description: "Mới (Phase 3): nullable — null khi log này chỉ ghi đổi assignedTo, không đổi status" }
        fieldChanged: { type: string, nullable: true, description: "Mới (Phase 3): 'status' | 'assignedTo'" }
        oldValue: { type: string, nullable: true, description: "Mới (Phase 3) — dùng khi fieldChanged=assignedTo (employeeId cũ)" }
        newValue: { type: string, nullable: true, description: "Mới (Phase 3) — dùng khi fieldChanged=assignedTo (employeeId mới)" }
        note: { type: string, nullable: true }
        changedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Order:
      type: object
      required: [id, customerId, totalAmount, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          description: ID khách hàng đặt đơn — tham chiếu Customer (xem /customers, mới ở Phase 2)
        customerName:
          type: string
          nullable: true
          description: "Mới — sao chép từ Customer.name tại thời điểm GET /orders, để FE hiển thị được kể cả khi tài khoản không có quyền GET /customers"
        leadId:
          type: string
          format: uuid
          nullable: true
          description: "Mới (Phase 3) — Lead phát sinh đơn này (nếu có), tham chiếu lỏng Lead.id"
        leadCode:
          type: string
          nullable: true
          description: "Mới — sao chép từ Lead.code tại thời điểm GET /orders, dùng để thống kê doanh thu theo Lead"
        assignedTo:
          type: string
          format: uuid
          nullable: true
          description: "Mới (Phase 3) — Sale phụ trách đơn này, tham chiếu Employee"
        assignedToName:
          type: string
          nullable: true
          description: "Mới — sao chép từ Employee.name tại thời điểm GET /orders, để FE hiển thị được kể cả khi tài khoản không có quyền GET /employees"
        shippingAddress: { type: string, nullable: true, description: "Mới (Phase 3) — Địa chỉ nhận hàng" }
        shippingPhone: { type: string, nullable: true, description: "Mới (Phase 3) — SĐT nhận hàng" }
        note: { type: string, nullable: true, description: "Mới (Phase 3) — Ghi chú hợp đồng" }
        totalAmount:
          type: number
          format: double
          description: Tổng giá trị hợp đồng (VNĐ)
        status:
          type: string
          description: Trạng thái xử lý hợp đồng
          enum: [pending, confirmed, shipped, delivered, cancelled]
        items:
          type: array
          description: "Mới (Phase 3) — nhúng kèm trong response GET /orders để hiển thị đủ cột Sản phẩm/Số lượng/Giá bán/%KM"
          items: { $ref: "#/components/schemas/OrderItem" }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateOrderInput:
      type: object
      required: [totalAmount]
      description: >
        Mới (Phase 3): customerId trở thành optional (giữ tương thích ngược) — cách tạo đơn khuyến
        nghị là truyền customerName + shippingPhone (+ shippingAddress) để Service tự upsert Customer,
        cùng thông tin sản phẩm để tạo kèm 1 OrderItem đầu tiên.
      properties:
        customerId:
          type: string
          minLength: 1
          description: "Cũ (Phase 1) — vẫn nhận, nhưng ưu tiên dùng customerName/shippingPhone bên dưới"
        leadId: { type: string, format: uuid, description: "Mới (Phase 3) — chỉ nhận Lead có status=converted và assignedTo=chính Sale đang tạo đơn" }
        assignedTo: { type: string, format: uuid, description: "Mới (Phase 3) — Sale phụ trách; mặc định = chính tài khoản Sale đang gọi API nếu không truyền" }
        customerName: { type: string, minLength: 1, description: "Mới (Phase 3) — dùng để upsert Customer theo shippingPhone" }
        shippingAddress: { type: string, description: "Mới (Phase 3)" }
        shippingPhone: { type: string, description: "Mới (Phase 3) — khoá upsert Customer (Customer.phone unique)" }
        note: { type: string, description: "Mới (Phase 3)" }
        productId: { type: string, format: uuid, description: "Mới (Phase 3) — tạo kèm 1 OrderItem đầu tiên" }
        productName: { type: string, description: "Mới (Phase 3)" }
        unit: { type: string, description: "Đơn vị tính — sao chép từ Product đã chọn" }
        quantity: { type: integer, minimum: 1, description: "Mới (Phase 3)" }
        unitPrice: { type: number, minimum: 0, description: "Mới (Phase 3)" }
        discountPercent: { type: number, minimum: 0, maximum: 100, description: "Mới (Phase 3) — % Khuyến mại" }
        totalAmount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: "Thành tiền — FE tự tính quantity*unitPrice*(1-discountPercent/100), Service không tính lại"
    UpdateOrderInput:
      type: object
      description: Mới (Phase 2) — chặn sửa khi status hiện tại đã là delivered/cancelled (nguyên tắc #6)
      properties:
        status: { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
    OrderItem:
      type: object
      description: Mới (Phase 2) — giải quyết bài toán gói combo nhiều sản phẩm + quà tặng
      required: [id, orderId, productId, productName, quantity, unitPrice, isGift, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        unit: { type: string, nullable: true, description: "Đơn vị tính — sao chép từ Product tại thời điểm tạo đơn" }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        discountPercent: { type: number, nullable: true, minimum: 0, maximum: 100, description: "Mới (Phase 3) — % Khuyến mại" }
        isGift: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
    CreateOrderItemInput:
      type: object
      required: [productId, productName, quantity, unitPrice]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string, minLength: 1 }
        unit: { type: string, description: "Đơn vị tính — sao chép từ Product đã chọn" }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        discountPercent: { type: number, minimum: 0, maximum: 100, description: "Mới (Phase 3)" }
        isGift: { type: boolean, default: false }
    Inventory:
      type: object
      required: [id, productId, quantity, warehouse, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          description: ID sản phẩm — tham chiếu Product (xem /products, mới ở Phase 2)
        quantity:
          type: integer
          minimum: 0
        warehouse:
          type: string
          description: Tên/mã kho chứa lô hàng
        updatedAt:
          type: string
          format: date-time
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AuthSession:
      type: object
      required: [accessToken, account]
      properties:
        accessToken: { type: string }
        account: { $ref: "#/components/schemas/AccountProfile" }
    ChangePasswordInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 6 }
    AccountProfile:
      type: object
      required: [id, username, isAdmin, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        isAdmin: { type: boolean }
        employeeName:
          type: string
          nullable: true
          description: >
            Mới (Phase 3) — tên nhân viên liên kết (join ngược Employee.accountId=Account.id),
            phái sinh lúc trả response, KHÔNG lưu trên bảng Account. Null nếu tài khoản chưa được
            liên kết tới Employee nào (ví dụ các tài khoản module mặc định seed sẵn).
        createdAt: { type: string, format: date-time }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
