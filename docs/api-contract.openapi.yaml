openapi: 3.0.3
info:
  title: F-Solution API
  version: "1.0.0"
  description: >
    Hợp đồng REST API dùng chung cho apps/backend (NestJS) và apps/frontend (React).
    Đây là nguồn sự thật contract-first — mọi endpoint mới phải được thêm ở đây
    trước khi Claude Code CLI viết code trong /build.
servers:
  - url: /api/v1
paths:
  # ============================================================
  # Phase 1 — ĐÃ BUILD/TEST/SHIP THẬT. Không sửa path/schema hiện có ở đây,
  # chỉ được bổ sung endpoint/field MỚI (additive). Xem docs/implementation_plan.md
  # mục "Quyết định thiết kế".
  # ============================================================
  /health:
    get:
      operationId: getHealth
      summary: Health check của backend
      tags: [system]
      security: []
      responses:
        "200":
          description: Backend đang hoạt động
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
  /leads:
    get:
      operationId: getLeads
      summary: >
        Lấy danh sách khách hàng tiềm năng. Mới (Phase 3): nếu tài khoản đăng nhập link tới 1
        Employee role=Sale (không phải admin), tự động chỉ trả về Lead có assignedTo=chính Sale đó
        (row-level filter, không cần truyền query param nào) — tài khoản khác (admin/module) thấy
        toàn bộ như cũ.
      tags: [CRM]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [new, contacted, qualified, converted, lost] }
          description: "Mới (Phase 3) — lọc theo trạng thái, dùng để đổ dropdown 'Chọn mã Lead' (status=converted)"
        - name: assignedTo
          in: query
          required: false
          schema: { type: string }
          description: >
            Mới (Phase 3) — truyền 'me' để lọc theo chính Sale đang đăng nhập, hoặc truyền thẳng
            employeeId. LƯU Ý bảo mật: nếu tài khoản gọi API là Sale bị giới hạn (không phải admin),
            giá trị này bị BỎ QUA hoàn toàn — server luôn ép về đúng chính họ, không thể ghi đè để
            xem Lead của Sale khác. Chỉ có tác dụng lọc tự do với admin/tài khoản không bị giới hạn.
      responses:
        "200":
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      summary: Tạo lead mới
      tags: [CRM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadInput"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    patch:
      operationId: updateLead
      summary: Cập nhật trạng thái/phân bổ Sale cho lead (mới — Phase 2)
      tags: [CRM]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLeadInput" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Lead" } } }
  /leads/{id}/logs:
    get:
      operationId: getLeadLogs
      summary: Lịch sử thay đổi trạng thái của 1 lead (mới — Phase 2, chỉ đọc, tự sinh khi PATCH /leads/{id})
      tags: [CRM]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LeadLog" } } } }
  /orders:
    get:
      operationId: getOrders
      summary: >
        Lấy danh sách hợp đồng (response nhúng kèm items[] — mới Phase 3, tránh phải gọi thêm
        GET /orders/{id}/items cho từng dòng). Mới (Phase 3): nếu tài khoản đăng nhập link tới 1
        Employee role=Sale (không phải admin), tự động chỉ trả về Order có assignedTo=chính Sale đó.
      tags: [Sales]
      parameters:
        - name: assignedTo
          in: query
          required: false
          schema: { type: string }
          description: >
            Mới (Phase 3) — truyền 'me' để lọc theo chính Sale đang đăng nhập, hoặc truyền thẳng
            employeeId. LƯU Ý bảo mật: nếu tài khoản gọi API là Sale bị giới hạn (không phải admin),
            giá trị này bị BỎ QUA hoàn toàn — server luôn ép về đúng chính họ, không thể ghi đè để
            xem Order của Sale khác. Chỉ có tác dụng lọc tự do với admin/tài khoản không bị giới hạn.
      responses:
        "200":
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      summary: >
        Tạo hợp đồng mới. Mới (Phase 3): nhận trực tiếp thông tin khách hàng + 1 sản phẩm (thay vì
        chỉ customerId) — Service tự upsert Customer theo shippingPhone (chưa tồn tại → tạo mới
        customerType=new; đã tồn tại → cập nhật customerType=old) và tạo kèm 1 OrderItem, cùng
        1 $transaction. customerId (cũ) vẫn nhận được để tương thích ngược, nhưng FE nên dùng bộ
        field mới bên dưới.
      tags: [Sales]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: >
            Thiếu customerId lẫn customerName+shippingPhone; hoặc leadId không tồn tại/chưa
            status=converted/không thuộc chính Sale đang gọi API (mới Phase 3)
  /orders/{id}:
    patch:
      operationId: updateOrder
      summary: Cập nhật trạng thái hợp đồng (mới — Phase 2; khoá sửa sau khi status=delivered theo nguyên tắc #6)
      tags: [Sales]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderInput" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "409": { description: "Đơn đã ở trạng thái khoá (delivered/cancelled), không cho sửa" }
  /orders/{id}/items:
    get:
      operationId: getOrderItems
      summary: Danh sách sản phẩm/quà tặng trong 1 hợp đồng (mới — Phase 2, giải quyết bài toán combo/quà tặng)
      tags: [Sales]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderItem" } } } }
    post:
      operationId: addOrderItem
      summary: Thêm sản phẩm/quà tặng vào hợp đồng
      tags: [Sales]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderItemInput" }
      responses:
        "201":
          description: Tạo thành công
          content: { application/json: { schema: { $ref: "#/components/schemas/OrderItem" } } }
  /inventory:
    get:
      operationId: getInventory
      summary: Lấy tồn kho thực tế
      tags: [Logistics]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inventory"
  /auth/login:
    post:
      operationId: login
      summary: Đăng nhập
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Sai tài khoản hoặc mật khẩu }
  /auth/me:
    get:
      operationId: getMe
      summary: Thông tin tài khoản đang đăng nhập + quyền
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /auth/change-password:
    patch:
      operationId: changePassword
      summary: Tự đổi mật khẩu (tài khoản đang đăng nhập)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "200": { description: Đổi mật khẩu thành công }
        "401": { description: Mật khẩu cũ không đúng }
  /accounts:
    get:
      operationId: listAccounts
      summary: Danh sách tài khoản
      tags: [account-management]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AccountProfile" } }
    post:
      operationId: createAccount
      summary: Tạo tài khoản mới
      tags: [account-management]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountInput" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /accounts/{id}:
    patch:
      operationId: updateAccount
      summary: Sửa tài khoản (đổi tên hiển thị, reset mật khẩu)
      tags: [account-management]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    delete:
      operationId: deleteAccount
      summary: Xoá tài khoản
      tags: [account-management]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Đã xoá }
        "409": { description: Không thể xoá tài khoản admin cuối cùng }
  /accounts/{id}/permissions:
    get:
      operationId: getAccountPermissions
      summary: Xem ma trận quyền của 1 tài khoản
      tags: [account-management]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    put:
      operationId: setAccountPermissions
      summary: Cập nhật ma trận quyền của 1 tài khoản
      tags: [account-management]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: "#/components/schemas/PermissionInput" } }
      responses:
        "200": { description: OK }

  # ============================================================
  # Phase 2 — MỚI, theo MÔ TẢ NGHIỆP VỤ CỤ THỂ.pdf (V3.0). Xem
  # docs/implementation_plan.md mục "Danh sách entity mới (Phase 2)" cho lý do
  # thiết kế và bảng ánh xạ module permission.
  # ============================================================
  /campaigns:
    get:
      operationId: getCampaigns
      summary: Lấy danh sách chiến dịch Marketing
      tags: [MKT]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } }
    post:
      operationId: createCampaign
      summary: Tạo chiến dịch
      tags: [MKT]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCampaignInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } }
  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      summary: Sửa chiến dịch (ngân sách, trạng thái)
      tags: [MKT]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCampaignInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /marketing-reports:
    get:
      operationId: getMarketingReports
      summary: Báo cáo hiệu suất Marketing nhập tay theo ngày/sản phẩm/thị trường (dữ liệu báo cáo, không phải nguồn sự thật)
      tags: [MKT]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MarketingReport" } } } }
    post:
      operationId: createMarketingReport
      summary: Nhập báo cáo Marketing
      tags: [MKT]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateMarketingReportInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/MarketingReport" } } }
  /marketing-reports/auto:
    get:
      operationId: getMarketingReportsAuto
      summary: >
        Mới — Báo cáo tự động Marketing, tính real-time (KHÔNG lưu bảng riêng) từ Lead.sourcedBy +
        Order theo khoảng ngày. Doanh thu map giữa nhân viên Marketing và doanh thu các Lead họ tạo.
      tags: [MKT]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: toDate
          in: query
          required: false
          description: "Gộp số liệu theo khoảng [date, toDate]. Bỏ trống thì chỉ tính 1 ngày (= date)."
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MarketingReportAuto" } } } }
        "400": { description: Thiếu query param 'date' }
  /customers:
    get:
      operationId: getCustomers
      summary: Lấy danh sách khách hàng (đã chuẩn hoá, tránh trùng lặp)
      tags: [Sales]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Customer" } } } }
    post:
      operationId: createCustomer
      summary: Tạo khách hàng mới
      tags: [Sales]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCustomerInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } }
  /customers/{id}:
    patch:
      operationId: updateCustomer
      summary: Sửa khách hàng (địa chỉ, loại khách, blacklist)
      tags: [Sales]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCustomerInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
  /sale-reports:
    get:
      operationId: getSaleReports
      summary: Báo cáo hiệu suất Sale nhập tay theo ngày/sản phẩm/thị trường
      tags: [Sales]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SaleReport" } } } }
    post:
      operationId: createSaleReport
      summary: "Nhập báo cáo Sale (DEPRECATED từ Phase 3 — FE không còn gọi, xem GET /sale-reports/auto). Giữ lại chỉ để không breaking, không xoá dữ liệu lịch sử."
      deprecated: true
      tags: [Sales]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSaleReportInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/SaleReport" } } }
  /sale-reports/auto:
    get:
      operationId: getSaleReportsAuto
      summary: >
        Mới (Phase 3) — Báo cáo hiệu suất Sale tự động, tính real-time (KHÔNG lưu bảng riêng) từ
        Lead/LeadLog/Order/OrderItem/Customer theo ngày. Thay thế luồng nhập tay POST /sale-reports.
      tags: [Sales]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: toDate
          in: query
          required: false
          description: "Mới — gộp số liệu theo khoảng [date, toDate]. Bỏ trống thì chỉ tính 1 ngày (= date)."
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SaleReportAuto" } } } }
  /shipments:
    get:
      operationId: getShipments
      summary: Quản lý vận đơn
      tags: [Logistics]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Shipment" } } } }
    post:
      operationId: createShipment
      summary: Đẩy đơn sang vận hành, tạo vận đơn
      tags: [Logistics]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateShipmentInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Shipment" } } }
  /shipments/{id}:
    patch:
      operationId: updateShipment
      summary: Cập nhật trạng thái giao hàng/tracking (nguyên tắc #3 — không tracking thì không set delivered)
      tags: [Logistics]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateShipmentInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Shipment" } } } }
        "400": { description: "Không có trackingCode nhưng cố set status=delivered" }
  /shipments/{id}/tracking-logs:
    get:
      operationId: getTrackingLogs
      summary: Lịch sử cập nhật trạng thái vận đơn (chỉ đọc, tự sinh khi PATCH /shipments/{id})
      tags: [Logistics]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TrackingLog" } } } }
  /warehouses:
    get:
      operationId: getWarehouses
      summary: Danh sách kho
      tags: [Logistics]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Warehouse" } } } }
    post:
      operationId: createWarehouse
      summary: Tạo kho mới
      tags: [Logistics]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateWarehouseInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Warehouse" } } }
  /inventory-transactions:
    get:
      operationId: getInventoryTransactions
      summary: Lịch sử nhập/xuất/điều chỉnh kho (Inventory Log)
      tags: [Logistics]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InventoryTransaction" } } } }
    post:
      operationId: createInventoryTransaction
      summary: Ghi nhận nhập/xuất/điều chỉnh kho (điều chỉnh bắt buộc có reason, theo nguyên tắc #5)
      tags: [Logistics]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateInventoryTransactionInput" } } }
      responses:
        "201":
          description: "Created — tự động cập nhật Inventory tương ứng"
          content: { application/json: { schema: { $ref: "#/components/schemas/InventoryTransaction" } } }
        "409": { description: "Xuất kho vượt tồn khả dụng (tồn thực - đơn giữ chỗ)" }
  /inventory-batches:
    get:
      operationId: getInventoryBatches
      summary: Danh sách lô hàng (phục vụ tính giá vốn trung bình) — chỉ đọc, sinh tự động khi có InventoryTransaction loại receipt
      tags: [Logistics]
      responses:
        "200":
          description: OK
