      properties:
        value: { type: string }
    AuditLog:
      type: object
      description: "Chỉ đọc, tự sinh ở tầng Service khi có thay đổi dữ liệu quan trọng — không có endpoint tạo qua API công khai"
      required: [id, tableName, recordId, changedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        tableName: { type: string }
        recordId: { type: string }
        fieldChanged: { type: string, nullable: true }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        changedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    DashboardEmployeeSeries:
      type: object
      required: [employeeName, values]
      properties:
        employeeId: { type: string, format: uuid, nullable: true, description: "null cho nhóm gộp 'Khác'" }
        employeeName: { type: string }
        values: { type: array, items: { type: number }, description: "Cùng độ dài với DashboardOverview.periods" }
    DashboardOverview:
      type: object
      required: [periods, revenueCostProfit, salesRevenue, marketingRevenue, leadStats, orderStats, cskhStats, cashFlow]
      properties:
        periods:
          type: array
          items: { type: string }
          description: "5 nhãn kỳ, thứ tự cũ -> mới"
        revenueCostProfit:
          type: array
          items:
            type: object
            required: [period, revenue, cost, profit]
            properties:
              period: { type: string }
              revenue: { type: number }
              cost: { type: number }
              profit: { type: number }
        salesRevenue:
          type: array
          items: { $ref: "#/components/schemas/DashboardEmployeeSeries" }
        marketingRevenue:
          type: array
          items: { $ref: "#/components/schemas/DashboardEmployeeSeries" }
        leadStats:
          type: array
          items: { $ref: "#/components/schemas/DashboardPeriodStats" }
        orderStats:
          type: array
          items: { $ref: "#/components/schemas/DashboardPeriodStats" }
        cskhStats:
          type: array
          items: { $ref: "#/components/schemas/DashboardPeriodStats" }
        cashFlow:
          type: array
          items:
            type: object
            required: [period, income, expense]
            properties:
              period: { type: string }
              income: { type: number }
              expense: { type: number }
    DashboardPeriodStats:
      type: object
      required: [period, total, byStatus]
      properties:
        period: { type: string }
        total: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
