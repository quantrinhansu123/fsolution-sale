      tags: [Admin]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditLog" } } } }
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      summary: >
        Mới — Dashboard Tổng Quan, chỉ admin xem được (module "dashboard" không có trong ma trận
        quyền quản lý được ở AccountsPage, cùng cách "audit-logs" đang làm). Tổng hợp real-time
        biến động Doanh thu/Chi phí/Lợi nhuận, doanh thu theo Sale, doanh thu Marketing gắn Lead,
        số lượng+trạng thái Lead/Hợp đồng/CSKH, và Thu-Chi, theo 5 kỳ gần nhất (Ngày/Tuần/Tháng).
